
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SleepGuard IA</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #101820;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h2 { color: #55d6be; }
    video {
      width: 100%;
      max-width: 480px;
      border-radius: 12px;
      transform: scaleX(-1);
      background: #263238;
    }
    #status {
      margin: 16px 0;
      padding: 14px;
      border-radius: 10px;
      background: #263238;
      font-weight: bold;
    }
    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      background: #55d6be;
      color: #101820;
      font-size: 16px;
      font-weight: bold;
    }
    p { color: #c9d3dc; }
  </style>
</head>
<body>
  <h2>SleepGuard IA</h2>
  <p>Detector experimental de fechamento dos olhos</p>

  <video id="video" autoplay muted playsinline></video>
  <div id="status">Toque em Iniciar câmera</div>
  <button id="start">Iniciar câmera</button>
  <p id="detail">Aguardando inicialização.</p>

  <script type="module">
    import {
      FaceLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("video");
    const status = document.getElementById("status");
    const detail = document.getElementById("detail");
    const start = document.getElementById("start");

    let detector;
    let lastVideoTime = -1;
    let closedSince = null;
    let lastSent = "";

    function report(message) {
      if (message !== lastSent) {
        lastSent = message;
        try {
          if (window.AppInventor &&
              window.AppInventor.setWebViewString) {
            window.AppInventor.setWebViewString(message);
          }
        } catch (e) {}
      }
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function eyeRatio(points, ids) {
      const p = ids.map(i => points[i]);
      const vertical =
        distance(p[1], p[5]) + distance(p[2], p[4]);
      const horizontal = 2 * distance(p[0], p[3]);
      return horizontal ? vertical / horizontal : 0;
    }

    async function initialize() {
      start.disabled = true;
      status.textContent = "Carregando modelo de IA...";
      detail.textContent = "Aguarde a inicialização.";

      try {
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );

        detector = await FaceLandmarker.createFromOptions(
          vision,
          {
            baseOptions: {
              modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
              delegate: "CPU"
            },
            runningMode: "VIDEO",
            numFaces: 1
          }
        );

        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        status.textContent = "Câmera iniciada";
        detail.textContent = "Procurando rosto...";
        report("CAMERA_ON");
        requestAnimationFrame(analyze);
      } catch (error) {
        status.textContent = "Não foi possível iniciar";
        detail.textContent = error.name + ": " + error.message;
        report("ERRO_CAMERA");
        start.disabled = false;
      }
    }

    function analyze() {
      if (!detector || video.readyState < 2) {
        requestAnimationFrame(analyze);
        return;
      }

      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;

        const result = detector.detectForVideo(
          video, performance.now()
        );

        if (result.faceLandmarks &&
            result.faceLandmarks.length > 0) {
          const points = result.faceLandmarks[0];

          const left = eyeRatio(
            points, [33, 160, 158, 133, 153, 144]
          );
          const right = eyeRatio(
            points, [362, 385, 387, 263, 373, 380]
          );
          const average = (left + right) / 2;

          detail.textContent =
            "Rosto detectado | Índice dos olhos: " +
            average.toFixed(3);

          if (average < 0.14) {
            if (closedSince === null) {
              closedSince = performance.now();
            }

            const duration = performance.now() - closedSince;

            if (duration >= 2000) {
              status.textContent =
                "ALERTA: OLHOS FECHADOS";
              report("SONOLENCIA");
            } else {
              status.textContent = "Olhos possivelmente fechados...";
              report("ANALISANDO");
            }
          } else {
            closedSince = null;
            status.textContent = "Rosto detectado — olhos abertos";
            report("OLHOS_ABERTOS");
          }
        } else {
          closedSince = null;
          status.textContent = "Nenhum rosto detectado";
          detail.textContent = "Posicione o rosto diante da câmera.";
          report("SEM_ROSTO");
        }
      }

      requestAnimationFrame(analyze);
    }

    start.addEventListener("click", initialize);
  </script>
</body>
</html>
